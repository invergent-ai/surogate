name: Build

# The build gate: the serving engine, and the quantiser that ships beside it.
#
# The engine half builds the one binary the RTX line ships -- sm_89 for the 4090, sm_120a for
# the 5090 and the RTX PRO 6000 -- and checks the result carries both, which is the property a
# single binary is easy to lose silently: a kernel family pinned to one architecture, or a build
# flag that quietly drops the other, still links and still passes every test on the machine that
# built it.
#
# The quantiser half arrives here from a workflow of its own. `surogate quantize` drives
# llama-quantize, which is fetched from llama.cpp at a pinned commit rather than vendored, and
# the only other job that builds it is the release wheel -- which fires on a tag, far too late
# to learn the pin no longer compiles. Its own job could never have told us either: it ran on a
# hosted CPU runner, and this project declares CUDA a project language, so cmake goes looking
# for nvcc and gives up before it reaches the quantiser at all. Here the toolkit is already
# present and the ccache is already warm, so the check costs a fetch and a CPU build.
#
# Self-hosted, because it has to be: this tree is ~300 CUDA translation units over CUTLASS, and
# the CUDA 13.1 toolkit the serve engine requires. A GitHub-hosted runner has neither the disk
# for the fatbin nor the time.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-*
    # A release tag runs this too. The wheel builds its own engine and checks the wheel it
    # produced, but two of the checks here have no equivalent there: that llama-quantize
    # reports the revision we pinned, and that the products start at all.
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# One self-hosted runner takes one job at a time, so runs queue rather than pile onto the
# machine -- but they still queue, and a full CUDA build is not quick. Superseding a branch or
# pull request run is the right call; superseding a tag is not, because that run is the record
# for a release, so tags are exempt from the cancellation.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  engine:
    name: Engine (sm_89 + sm_120a) and quantiser
    runs-on: self-hosted
    container:
      image: nvidia/cuda:13.1.1-cudnn-devel-ubuntu24.04
      options: -v /var/cache/surogate-ccache/engine:/ccache
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_CUDA_PATHS: /usr/local/cuda
      # The runner is a working machine. Leave it cores.
      PARALLEL_JOBS: 16

    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build ccache python3-dev pkg-config \
            libdw-dev libelf-dev libnuma-dev libcurl4-openssl-dev libssl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libnccl2 libnccl-dev

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup ccache
        run: |
          mkdir -p /ccache
          ccache --max-size=20G
          ccache --zero-stats

      # Not `make serve-build`: that copies the module into a virtualenv this container has no
      # reason to own. The targets are the products themselves.
      - name: Configure
        run: |
          cmake -S csrc -B csrc/build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUROGATE_REQUIRE_SERVE=ON \
            -DSUROGATE_BUILD_QUANTIZER=ON \
            -DPYTHON_BINDING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the products
        run: |
          cmake --build csrc/build-ci --parallel "${PARALLEL_JOBS}" \
            --target surogate-engine surogate-engine-cli surogate-embed llama-quantize

      - name: Show ccache stats
        run: ccache --show-stats

      # The point of the gate. `cuobjdump -lelf` lists every cubin in the library; both
      # architectures must be there, and the Blackwell-only families (NVFP4 W4A4, the TMA
      # kernels, the TRT-LLM MoE runner) are why the counts differ rather than match.
      - name: The binary carries both architectures
        run: |
          set -euo pipefail
          lib=csrc/build-ci/libsinfer.so
          test -f "$lib"
          cuobjdump -lelf "$lib" | grep -oE 'sm_[0-9]+a?' | sort | uniq -c | tee /tmp/cubins.txt
          ada=$(grep -c 'sm_89'    /tmp/cubins.txt || true)
          bw=$(grep -c 'sm_120a'   /tmp/cubins.txt || true)
          if [ "$ada" -eq 0 ] || [ "$bw" -eq 0 ]; then
            echo "::error::libsinfer.so is missing an architecture — the RTX line needs sm_89 and sm_120a"
            exit 1
          fi

      - name: The products run
        run: |
          set -euo pipefail
          for binary in surogate-engine surogate-engine-cli; do
            csrc/build-ci/"$binary" --help > /dev/null
          done
          echo "engine, cli and embed link and start"

      # Installing is the half a wheel does, and where a wrong destination would show up: the
      # binary, the converter, its conversion package and the `gguf` library the converter puts
      # on sys.path all have to land inside `surogate/`, or an installed package has a command
      # with nothing to run.
      - name: The quantiser installs into the package
        run: |
          set -euo pipefail
          cmake --install csrc/build-ci --prefix . --component quantizer
          test -x surogate/serve/_llama_cpp/bin/llama-quantize
          test -f surogate/serve/_llama_cpp/convert_hf_to_gguf.py
          test -d surogate/serve/_llama_cpp/conversion
          test -f surogate/serve/_llama_cpp/gguf-py/gguf/__init__.py
          test -f surogate/serve/_llama_cpp/LICENSE

      # The revision the binary reports has to be the revision we pinned. A tarball carries no
      # git, so the commit reaches the binary through two CMake variables set by hand, and if the
      # pin is bumped while they are not, every file this quantiser writes claims a provenance
      # that never built it.
      #
      # There is no --version flag: it falls through to usage and exits 0, which is why the
      # check this replaces could never have passed. `llama_print_build_info` runs after argument
      # parsing and before the model is opened, so a dry run of a file that does not exist prints
      # the build line and then fails on the missing model. That failure is the exit code, so it
      # is deliberately discarded -- the assertion is the line, not the status.
      - name: The quantiser reports the pinned revision
        run: |
          set -euo pipefail
          pinned=$(grep -oP 'LLAMA_BUILD_COMMIT "\K[0-9a-f]+' csrc/cmake/llama_cpp_quantizer.cmake)
          echo "pinned: $pinned"
          surogate/serve/_llama_cpp/bin/llama-quantize --dry-run /nonexistent.gguf Q4_K \
            > /tmp/build-info.txt 2>&1 || true
          head -2 /tmp/build-info.txt
          if ! grep -q "commit $pinned" /tmp/build-info.txt; then
            echo "::error::llama-quantize reports a revision other than the pinned $pinned — LLAMA_BUILD_COMMIT and LLAMA_CPP_COMMIT are out of step"
            exit 1
          fi
