name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 0.1.1). Leave empty to use latest git tag.'
        required: false
        type: string
      cuda_versions:
        description: 'CUDA versions to build (comma-separated: cu128,cu130, or "all")'
        required: true
        default: 'all'
        type: string
  workflow_run:
    workflows: ["Build Wheels"]
    types:
      - completed

jobs:
  docker:
    name: Build Docker image (CUDA ${{ matrix.wheel_tag }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # Keep this matrix in step with the wheel matrix in wheel.yml —
          # each image installs the wheel built for the matching CUDA tag.
          #
          # `serve` mirrors that matrix too: the engine needs CUDA 13.1, so only the cu130 image
          # has one, and only it is worth asking whether `surogate serve` can find its binary.
          - wheel_tag: "cu128"
            dockerfile: "Dockerfile.cu128"
            serve: false
          - wheel_tag: "cu130"
            dockerfile: "Dockerfile.cu130"
            serve: true

    steps:
      - name: Check if this CUDA version should be built
        id: should_build
        run: |
          REQUESTED="${{ inputs.cuda_versions }}"
          REQUESTED="${REQUESTED:-all}"
          CURRENT="${{ matrix.wheel_tag }}"

          if [[ "$REQUESTED" == "all" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ ",$REQUESTED," == *",$CURRENT,"* ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.should_build.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.should_build.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        if: steps.should_build.outputs.build == 'true'
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            # Get latest tag
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null || echo "v0.0.1")
            VERSION="${LATEST_TAG#v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "Using latest tag: ${VERSION}"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/surogate
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest-${{ matrix.wheel_tag }}
            type=sha

      - name: Build and push Docker image
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            PACKAGE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/invergent-ai/surogate:${{ steps.version.outputs.version }}-${{ matrix.wheel_tag }}
            ghcr.io/invergent-ai/surogate:${{ steps.version.outputs.version }}
            ghcr.io/invergent-ai/surogate:latest-${{ matrix.wheel_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.wheel_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.wheel_tag }}

      # The image is the last place the packaging can go wrong, and the first place a user
      # meets it. Two questions, and neither answers the other.
      #
      # `_resolve_binary` is how `surogate serve` decides what to exec, but it only asks whether
      # a file is there -- so it passes on a binary that cannot start, which is exactly what this
      # image shipped: the engine links FFmpeg and libnuma, and nothing installed them. `ldd`
      # asks the other half, whether the image carries what the binary loads, and it needs no GPU.
      #
      # libcuda.so.1 is the driver. The container runtime injects it under `--gpus`, so it is
      # absent here by design and is the one permitted miss. Everything else that resolves here
      # -- libcudart and libcublasLt out of the pip CUDA wheels included -- is a live check on
      # the ld.so.conf.d paths written above, which is the other thing that has no test.
      - name: The engine is whole in the image
        if: steps.should_build.outputs.build == 'true' && matrix.serve
        run: |
          set -euo pipefail
          image="ghcr.io/invergent-ai/surogate:${{ steps.version.outputs.version }}-${{ matrix.wheel_tag }}"
          docker run --rm -i --entrypoint python3 "$image" - <<'PY'
          import subprocess, sys
          from surogate.cli.serve import _resolve_binary

          DRIVER = "libcuda.so.1"
          problems = []
          for mode in ("server", "generate", "embed"):
              path = _resolve_binary(mode)
              if path is None:
                  problems.append(f"{mode}: surogate serve cannot find a binary to exec")
                  continue
              ldd = subprocess.run(["ldd", path], capture_output=True, text=True).stdout
              missing = [ln.split("=>")[0].strip() for ln in ldd.splitlines()
                         if "not found" in ln and DRIVER not in ln]
              if missing:
                  problems.append(f"{mode}: {path} cannot load " + ", ".join(missing))
              else:
                  print(f"ok: {mode} -> {path}")
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          PY
