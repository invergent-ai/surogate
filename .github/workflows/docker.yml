name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 0.1.1). Leave empty to use latest git tag.'
        required: false
        type: string
      cuda_versions:
        description: 'CUDA tags to build (only cu130 exists; "all" builds it)'
        required: false
        default: 'all'
        type: string
  workflow_run:
    workflows: ["Build Wheels"]
    types:
      - completed

jobs:
  docker:
    name: Build Docker image (CUDA ${{ matrix.wheel_tag }})
    runs-on: ubuntu-latest
    # After a wheel build, only when that build was for a release tag: a manual wheel run
    # (workflow_dispatch on a branch) publishes nothing, so there is nothing to put in an image.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # Keep this matrix in step with the wheel matrix in wheel.yml — the image installs the
          # wheel built for the matching CUDA tag, and there is one, because the engine needs
          # CUDA 13.0 or newer.
          - wheel_tag: "cu130"
            dockerfile: "Dockerfile.cu130"

    steps:
      - name: Check if this CUDA version should be built
        id: should_build
        run: |
          REQUESTED="${{ inputs.cuda_versions }}"
          REQUESTED="${REQUESTED:-all}"
          CURRENT="${{ matrix.wheel_tag }}"

          if [[ "$REQUESTED" == "all" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ ",$REQUESTED," == *",$CURRENT,"* ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      # After a wheel build, check out the commit that built the wheels, so the Dockerfile
      # matches the release; a manual run takes the branch it was started from.
      - name: Checkout code
        if: steps.should_build.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.should_build.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        if: steps.should_build.outputs.build == 'true'
        id: version
        run: |
          # The version is the release tag that built the wheels. For a workflow_run trigger
          # that tag is the run's head_branch (a tag push reports the tag there), which is exact
          # even when the tag is not on main's history; the nearest v* tag is only the fallback.
          TRIGGER_REF="${{ github.event.workflow_run.head_branch }}"
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$TRIGGER_REF" == v* ]]; then
            VERSION="${TRIGGER_REF#v}"
            echo "Using the tag that built the wheels: ${VERSION}"
          else
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null || echo "v0.0.1")
            VERSION="${LATEST_TAG#v}"
            echo "Using latest tag: ${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Docker metadata
        if: steps.should_build.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/surogate
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest-${{ matrix.wheel_tag }}
            type=sha

      - name: Build and push Docker image
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            PACKAGE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/invergent-ai/surogate:${{ steps.version.outputs.version }}-${{ matrix.wheel_tag }}
            ghcr.io/invergent-ai/surogate:${{ steps.version.outputs.version }}
            ghcr.io/invergent-ai/surogate:latest-${{ matrix.wheel_tag }}
            ghcr.io/invergent-ai/surogate:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.wheel_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.wheel_tag }}

      # The image is the last place the packaging can go wrong, and the first place a user
      # meets it. Two questions, and neither answers the other.
      #
      # `_resolve_binary` is how `surogate serve` decides what to exec, but it only asks whether
      # a file is there -- so it passes on a binary that cannot start, which is exactly what this
      # image shipped: the engine links FFmpeg and libnuma, and nothing installed them. `ldd`
      # asks the other half, whether the image carries what the binary loads, and it needs no GPU.
      #
      # libcuda.so.1 is the driver. The container runtime injects it under `--gpus`, so it is
      # absent here by design and is the one permitted miss. Everything else that resolves here
      # -- libcudart and libcublasLt out of the pip CUDA wheels included -- is a live check on
      # the ld.so.conf.d paths written above, which is the other thing that has no test.
      - name: The engine is whole in the image
        if: steps.should_build.outputs.build == 'true'
        run: |
          set -euo pipefail
          image="ghcr.io/invergent-ai/surogate:${{ steps.version.outputs.version }}-${{ matrix.wheel_tag }}"
          docker run --rm -i --entrypoint python3 "$image" - <<'PY'
          import subprocess, sys
          from surogate.cli.serve import _resolve_binary

          DRIVER = "libcuda.so.1"
          problems = []
          for mode in ("server", "generate", "embed"):
              path = _resolve_binary(mode)
              if path is None:
                  problems.append(f"{mode}: surogate serve cannot find a binary to exec")
                  continue
              ldd = subprocess.run(["ldd", path], capture_output=True, text=True).stdout
              missing = [ln.split("=>")[0].strip() for ln in ldd.splitlines()
                         if "not found" in ln and DRIVER not in ln]
              if missing:
                  problems.append(f"{mode}: {path} cannot load " + ", ".join(missing))
              else:
                  print(f"ok: {mode} -> {path}")
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          PY

      # The step above asks whether the image carries what the *binary* loads.
      # This asks the same of the *package*, and it is the half that was
      # missing: `surogate.cli.serve` was the only module anything imported
      # here, so a dependency the GRPO path needs and pyproject does not
      # declare passed a green build and failed on a user's GPU. That is
      # exactly what happened to `msgspec`, undeclared since the transport
      # landed in v1.0.0 and carried transitively by vLLM until the rollout
      # server stopped being vLLM.
      #
      # The list is every module on a run's import path that resolves without
      # a GPU, and it was established by running it against the image rather
      # than reasoned about. `surogate.grpo.split`, `cli.sft`,
      # `cli.distill_capture` and `distill.capture` are deliberately absent:
      # each pulls in CUDA symbols and fails with `libcuda.so.1: cannot open
      # shared object file` without `--gpus`, which this runner does not have.
      # Same reason the step above treats libcuda.so.1 as its one permitted
      # miss. Adding one of them makes this step red on every build.
      - name: The package can import what a run will import
        if: steps.should_build.outputs.build == 'true'
        run: |
          set -euo pipefail
          image="ghcr.io/invergent-ai/surogate:${{ steps.version.outputs.version }}-${{ matrix.wheel_tag }}"
          docker run --rm -i --entrypoint python3 "$image" - <<'PY'
          import importlib, sys

          MODULES = [
              "surogate.cli.grpo",
              "surogate.grpo.transport.base",
              "surogate.grpo.transport.types",
              "surogate.grpo.utils.client",
              "surogate.grpo.orchestrator.grpo_orch",
          ]
          problems = []
          for name in MODULES:
              try:
                  importlib.import_module(name)
                  print(f"ok: {name}")
              except Exception as exc:
                  problems.append(f"{name}: {type(exc).__name__}: {exc}")
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          PY
