# The serving engine's tests, on every push and pull request.
#
# Until this existed nothing ran them. The suite was real -- 107 C++ tests and nine Python
# files -- and unrun, which is how one target came to be broken against renamed symbols for
# long enough that nobody remembered the rename. The C++ half needs a GPU and cannot run on a
# hosted runner; the Python half needs neither a GPU nor a checkpoint, so it runs here and
# covers the converters, the artifact container and the declaration contract. A test whose
# fixture is missing skips rather than fails, so this job is meaningful without any weights.
name: Serve tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-*
      - serve-engine
  pull_request:
    branches:
      - main

concurrency:
  group: serve-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Serve tests (Python, CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The serve tests import torch, numpy, safetensors and gguf, and nothing that needs a
      # GPU. Installing the project itself would build the CUDA extension, which this runner
      # has no toolkit for, so the dependencies go in directly.
      - name: Install test dependencies
        run: |
          uv venv
          uv pip install pytest numpy safetensors gguf jinja2 \
            torch --torch-backend=cpu

      - name: Run the serve suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest -q tests/serve tests/test_serve_contract.py

      # The declaration is the single source of truth for what a serving artifact holds, and
      # the emitters prove it by regenerating the committed targets. Run separately so a
      # failure here reads as "the DSL and the engine disagree about a model" rather than as
      # one more red test.
      - name: Check the targets still regenerate from the declaration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest -q tests/test_serve_contract.py -k "regenerat or derives or declaration"
