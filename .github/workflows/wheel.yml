name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  # A manual run builds and checks both wheels and uploads them as artifacts; only a tag
  # publishes a release. That is how a change to this file is proven before a tag depends on it.
  workflow_dispatch:

jobs:
  wheel:
    name: Build wheel (CUDA ${{ matrix.cuda_version }})
    # GitHub-hosted. The standard runner is 4 vCPUs, 16 GB and a root disk that needs the usual
    # cleanup before a CUDA toolkit fits; a cold cu130 build is ~8 CPU-hours, so around two and
    # a half hours here, well inside the six-hour limit, and ccache (kept in the Actions cache)
    # makes the next one much shorter. An org admin can point SUROGATE_WHEEL_RUNNER (a
    # repository variable) at a larger runner label; nothing else changes.
    runs-on: ${{ vars.SUROGATE_WHEEL_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          # `archs` is the *trainer's* architecture set (CUDAARCHS), and it is the only place
          # one exists: csrc/CMakeLists.txt declares a floor (SUROGATE_MIN_CUDA_ARCH 89) and,
          # left alone, probes nvidia-smi and builds for the one card it finds. So this list is
          # what the published wheels can run on, and nothing else has an opinion.
          #
          # Three architectures, each with a claim on it. sm_89 is Ada -- the 4090, L4, L40.
          # sm_90a is Hopper, which the README's headline benchmark is measured on (53,900
          # tok/s on one H100). sm_120a is the RTX 50 series and the RTX PRO 6000. Datacenter
          # Blackwell -- sm_100a (B200) and sm_103a (B300) -- is not here: no code path, no
          # benchmark and no config asks for it, and carrying it cost a whole third wheel,
          # since sm_103a is the one thing CUDA 12.8 cannot compile.
          #
          # The serve engine keeps its own list, `SUROGATE_SERVE_CUDA_ARCHS`, narrower still at
          # sm_89 and sm_120a -- one binary for the 4090, the 5090 and the RTX PRO 6000. It is
          # left at its default here and checked in the wheel afterwards; restating it in the
          # workflow would only be a second place to be wrong.
          #
          # `serve` says whether this toolkit can build the engine at all: it needs CUDA 13.1,
          # so the older wheel is trainer-only and says so rather than dropping the engine
          # quietly (SUROGATE_REQUIRE_SERVE turns a missing engine into a failed build).
          #
          # Two wheels, not three. A binary built against 12.8 runs on any 12.x runtime -- CUDA
          # minor version compatibility -- and nothing here links torch, so there is no ABI
          # tying a wheel to one toolkit. cu128 covers the whole 12.x line, and anyone
          # whose driver predates CUDA 13, which is why it is not folded into cu130 as well.
          #
          # The toolkit comes from NVIDIA's apt repository for Ubuntu 24.04 rather than a
          # nvidia/cuda container: a job container starts before any step can free the
          # runner's disk, and the devel images are 7-10 GB on their own.
          - cuda_version: "12.8"
            wheel_tag: "cu128"
            archs: "89;90a;120a"
            serve: false
          - cuda_version: "13.1"
            wheel_tag: "cu130"
            archs: "89;90a;120a"
            serve: true
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER: gcc-13
      CMAKE_CXX_COMPILER: g++-13
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
      # Four jobs at one nvcc thread each is what 16 GB holds: nvcc's default of 8 threads
      # compiles the three architectures at once and triples the per-job footprint
      # (csrc/CMakeLists.txt reads NVCC_THREADS into SUROGATE_NVCC_THREADS). The swap file
      # made below is the margin for the libsinfer.so link.
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      NVCC_THREADS: 1
      CUDAARCHS: ${{ matrix.archs }}
      CUDA_HOME: /usr/local/cuda-${{ matrix.cuda_version }}
      CUDACXX: /usr/local/cuda-${{ matrix.cuda_version }}/bin/nvcc
      CCACHE_CUDA_PATHS: /usr/local/cuda-${{ matrix.cuda_version }}
      CCACHE_MAXSIZE: 3G
      # pyproject asks for the engine unconditionally; a toolkit older than 13.1 cannot give it
      # one, and that is a fact about the toolkit rather than a broken build host. The define
      # merges with pyproject's (scikit-build-core merges dict settings, env winning per key).
      SKBUILD_CMAKE_DEFINE: SUROGATE_REQUIRE_SERVE=${{ matrix.serve && 'ON' || 'OFF' }};SUROGATE_BUILD_SERVE=${{ matrix.serve && 'ON' || 'OFF' }}
      # pyproject also names the serve products in `build.targets` and `install.components`, and
      # a target CMake never defined fails `cmake --build`. Lists do not merge: a non-empty value
      # here replaces pyproject's, an empty one leaves it alone. So the trainer-only wheel says
      # exactly what it builds, and the serving wheel takes pyproject's full list.
      SKBUILD_BUILD_TARGETS: ${{ matrix.serve && '' || '_surogate;llama-quantize' }}
      SKBUILD_INSTALL_COMPONENTS: ${{ matrix.serve && '' || 'surogate;quantizer' }}
      UV_NO_SYNC: 1

    steps:
      # The runner image ships toolchains this build never uses, on the disk it needs. What is
      # left after removing them, plus the second disk at /mnt, is where the build lives:
      # the build tree, the temporary install the wheel is packed from, uv's cache and ccache
      # all go to whichever disk has the most room, and the swap file to /mnt.
      - name: Make room on the runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/julia* /opt/microsoft /usr/lib/jvm /usr/local/lib/node_modules /opt/az \
            /usr/local/share/chromium /usr/local/share/vcpkg 2>/dev/null || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          mnt_free=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9 || echo 0)
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "${mnt_free:-0}" -ge "$root_free" ]; then work=/mnt/surogate; else work=/home/runner/surogate-work; fi
          sudo mkdir -p "$work"/{tmp,uv-cache,ccache,build} && sudo chown -R "$(id -u):$(id -g)" "$work"
          {
            echo "SUROGATE_WORK=$work"
            echo "TMPDIR=$work/tmp"
            echo "UV_CACHE_DIR=$work/uv-cache"
            echo "CCACHE_DIR=$work/ccache"
            echo "SKBUILD_BUILD_DIR=$work/build/${{ matrix.wheel_tag }}"
          } >> "$GITHUB_ENV"
          swap=$(( ${mnt_free:-0} / 3 )); [ "$swap" -gt 24 ] && swap=24
          if [ "$swap" -ge 4 ]; then
            sudo fallocate -l "${swap}G" /mnt/swapfile-build && sudo chmod 600 /mnt/swapfile-build \
              && sudo mkswap /mnt/swapfile-build >/dev/null && sudo swapon /mnt/swapfile-build
          fi
          echo "work dir: $work (root ${root_free} GB free, /mnt ${mnt_free:-0} GB free, swap +${swap} GB)"
          df -h / /mnt 2>/dev/null; free -g

      - name: Install CUDA ${{ matrix.cuda_version }} and build dependencies
        run: |
          set -euo pipefail
          wget -qO /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update -qq
          v="${{ matrix.cuda_version }}"; pkg="${v/./-}"; major="${v%%.*}"
          # NCCL is published per CUDA version (2.29.3-1+cuda13.1, 2.26.2-1+cuda12.8, ...); take
          # the newest build for this toolkit, else the newest for its major (the runtime
          # soname is the same across a major, and install.sh pins the runtime wheel).
          versions=$(apt-cache madison libnccl2 | awk '{print $3}')
          nccl=$(echo "$versions" | grep -F "+cuda${v}" | sort -V | tail -1)
          [ -n "$nccl" ] || nccl=$(echo "$versions" | grep -F "+cuda${major}." | sort -V | tail -1)
          [ -n "$nccl" ] || { echo "::error::no libnccl2 build for CUDA ${v} in the repository"; exit 1; }
          echo "nccl: $nccl"
          sudo apt-get install -y -qq --no-install-recommends \
            "cuda-toolkit-${pkg}" "cudnn9-cuda-${major}" "libnccl2=${nccl}" "libnccl-dev=${nccl}" \
            ninja-build ccache libopenmpi-dev libdw-dev libelf-dev libicu-dev patch \
            pkg-config libcurl4-openssl-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libnuma-dev
          echo "/usr/local/cuda-${v}/bin" >> "$GITHUB_PATH"
          "/usr/local/cuda-${v}/bin/nvcc" --version | tail -2
          gcc-13 --version | head -1
          df -h / | tail -1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      # Restore and save are separate so a run that times out or fails still seeds the cache
      # for the next one: a cold build is hours, a warm one minutes.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.wheel_tag }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.wheel_tag }}-

      - name: Setup ccache
        run: |
          ccache --max-size=3G
          ccache --zero-stats

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust for structured output
        if: matrix.serve
        run: |
          if ! command -v rustup >/dev/null; then
            wget -qO /tmp/surogate-rustup.sh https://sh.rustup.rs
            sh /tmp/surogate-rustup.sh -y --profile minimal --default-toolchain 1.90.0
          else
            rustup toolchain install 1.90.0 --profile minimal
            rustup default 1.90.0
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add CUDA version tag
        run: uv run --no-project --with tomlkit python3 .github/scripts/set_cuda_version_tag.py "${{ matrix.wheel_tag }}"

      - name: Build wheel
        run: uv build --wheel --out-dir wheelhouse

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.wheel_tag }}-${{ github.sha }}

      # The build tree has done its work; the repair and the checks below need the room.
      - name: Drop the build tree
        run: rm -rf "${SUROGATE_WORK}/build" "${UV_CACHE_DIR}" && df -h / /mnt 2>/dev/null | tail -2

      # auditwheel vendors every shared library the wheel's ELF files load and the manylinux
      # policy does not promise, and patches their RPATHs to find the copies. What is excluded
      # arrives another way and must stay excluded: the CUDA driver and the CUDA runtime libraries
      # come from the driver and the nvidia-* wheels the RPATHs already point at; libtorch is
      # surogate-stt's, from the torch wheel the package pins, reached through its own RPATH.
      # Vendoring a second libtorch would double the wheel and fail here anyway, since the build's
      # isolated environment is gone by the time this step runs.
      - name: Repair wheel
        run: |
          uv run --no-project --with auditwheel --with patchelf auditwheel repair wheelhouse/*.whl \
            -w repaired/ \
            --exclude libcuda.so.1 \
            --exclude libcudart.so.12 \
            --exclude libcudart.so.13 \
            --exclude libcudnn.so.9 \
            --exclude libcufile.so.0 \
            --exclude libnccl.so.2 \
            --exclude libcublas.so.12 \
            --exclude libcublas.so.13 \
            --exclude libcublasLt.so.12 \
            --exclude libcublasLt.so.13 \
            --exclude libnvidia-ml.so.1 \
            --exclude libcupti.so.13 \
            --exclude libnvrtc.so.13 \
            --exclude libtorch_cpu.so \
            --exclude libtorch.so \
            --exclude libc10.so
          mv repaired/*.whl wheelhouse/
          rm -f wheelhouse/*linux_x86_64*.whl
          ls -lh wheelhouse/

      # An install-rule or component mistake produces a wheel that builds, installs, imports --
      # and has no engine in it. The only way to know is to look inside the artifact.
      - name: The wheel carries the engine, for both architectures
        if: matrix.serve
        run: |
          set -euo pipefail
          check="${TMPDIR}/wheel-check"
          rm -rf "$check" && mkdir -p "$check"
          python3 -m zipfile -e wheelhouse/*.whl "$check"
          for f in surogate/serve/_bin/surogate-engine \
                   surogate/serve/_bin/surogate-engine-cli \
                   surogate/serve/_bin/surogate-embed \
                   surogate/serve/_bin/surogate-stt \
                   surogate/serve/_bin/surogate-stt-lm \
                   surogate/serve/_bin/surogate-tts \
                   surogate/serve/_bin/surogate-tts-worker \
                   surogate/libsinfer.so \
                   surogate/serve/_llama_cpp/bin/llama-quantize; do
            if [ ! -f "$check/$f" ]; then
              echo "::error::the wheel is missing $f"
              exit 1
            fi
          done
          cuobjdump -lelf "$check/surogate/libsinfer.so" \
            | grep -oE 'sm_[0-9]+a?' | sort | uniq -c | tee "${TMPDIR}/wheel-cubins.txt"
          for arch in sm_89 sm_120a; do
            if ! grep -q "$arch" "${TMPDIR}/wheel-cubins.txt"; then
              echo "::error::the wheel's engine has no $arch cubins — it does not serve the whole RTX line"
              exit 1
            fi
          done
          rm -rf "$check"

      # Both wheels train, and the trainer's device code lives in libsurogate-common.so (the
      # extension module is a thin binding). CUDAARCHS above is the promise; this is the check.
      - name: The wheel trains on Ada, Hopper and Blackwell
        run: |
          set -euo pipefail
          check="${TMPDIR}/wheel-check"
          rm -rf "$check" && mkdir -p "$check"
          python3 -m zipfile -e wheelhouse/*.whl "$check"
          cuobjdump -lelf "$check/surogate/libsurogate-common.so" \
            | grep -oE 'sm_[0-9]+a?' | sort | uniq -c | tee "${TMPDIR}/trainer-cubins.txt"
          for arch in sm_89 sm_90a sm_120a; do
            if ! grep -q "$arch" "${TMPDIR}/trainer-cubins.txt"; then
              echo "::error::the trainer has no $arch cubins"
              exit 1
            fi
          done
          rm -rf "$check"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_tag }}
          path: wheelhouse/*.whl

  release:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find previous tag
        id: prev
        shell: bash
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"

          # previous release tag before the current one. --match keeps the jackalope release
          # channel's tags (jackalope-latest, jackalope-vX.Y.Z) out of the changelog range.
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${current}^" 2>/dev/null || true)"

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from Conventional Commits
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            ${{ steps.prev.outputs.prev && format('{0}..HEAD', steps.prev.outputs.prev) || '' }}
            --strip header
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheelhouse/
          merge-multiple: true

      - name: Pin version in install.sh
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s|^VERSION_OVERRIDE=\"\"|VERSION_OVERRIDE=\"${version}\"|" install.sh
          grep '^VERSION_OVERRIDE=' install.sh

      - name: Create release with changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            wheelhouse/*.whl
            install.sh
          draft: false
          fail_on_unmatched_files: true
