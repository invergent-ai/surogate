name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  # A manual run builds and checks the wheel and uploads it as an artifact; only a tag
  # publishes a release. That is how a change to this file is proven before a tag needs it.
  workflow_dispatch:

jobs:
  wheel:
    name: Build wheel (CUDA ${{ matrix.cuda_version }})
    # The self-hosted runner is this project's build box and is far faster than a GitHub-hosted
    # one (dozens of cores against four). `SUROGATE_WHEEL_RUNNER`, a repository variable,
    # redirects the job to another label -- `ubuntu-24.04`, say -- without editing this file,
    # for when the box is busy or offline.
    runs-on: ${{ vars.SUROGATE_WHEEL_RUNNER || 'self-hosted' }}
    # The runner is a shared training host: a training run holds ~180 GB and a vLLM container
    # ~160 GB, leaving ~160 GB for everything else. The build container gets a hard memory limit
    # so a compile can never take the host down: an uncapped build at 20 jobs invoked the OOM
    # killer on 2026-09-21 and killed a nine-hour training run. Inside the cgroup the kernel
    # kills the build, which fails the job; outside it, nothing else on the host is touched.
    # 60 GB holds 8 jobs at one nvcc thread each (NVCC_THREADS below) with room for the
    # libsinfer.so link; nvcc's default of 8 threads compiles the three architectures at once
    # and triples the per-job footprint.
    container:
      image: ${{ matrix.cuda_build_image }}
      options: -v /var/cache/surogate-ccache/${{ matrix.cuda_version }}:/ccache --memory 60g --memory-swap 60g

    strategy:
      matrix:
        include:
          # One wheel. The engine needs CUDA 13.0 or newer -- 12.8 and 12.9 cap a block's static
          # shared memory at 48 KB and refuse the W8 and NVFP4 GEMM families for sm_120a -- and a
          # package that serves is the product, so there is no CUDA 12 wheel to build. 13.1 is
          # the newest of that line; a binary built with it runs on a 13.0 driver.
          #
          # `archs` is the *trainer's* architecture set (CUDAARCHS), and it is the only place one
          # exists: csrc/CMakeLists.txt declares a floor (SUROGATE_MIN_CUDA_ARCH 89) and, left
          # alone, probes nvidia-smi and builds for the one card it finds. So this list is what
          # the published wheel can train on, and nothing else has an opinion.
          #
          # Three architectures, each with a claim on it. sm_89 is Ada -- the 4090, L4, L40.
          # sm_90a is Hopper, which the README's headline benchmark is measured on (53,900
          # tok/s on one H100). sm_120a is the RTX 50 series and the RTX PRO 6000. Datacenter
          # Blackwell -- sm_100a (B200) and sm_103a (B300) -- is not here: no code path, no
          # benchmark and no config asks for it.
          #
          # The serve engine keeps its own list, `SUROGATE_SERVE_CUDA_ARCHS`, narrower still at
          # sm_89 and sm_120a -- one binary for the 4090, the 5090 and the RTX PRO 6000. It is
          # left at its default here and checked in the wheel afterwards; restating it in the
          # workflow would only be a second place to be wrong.
          - cuda_version: "13.1"
            cuda_build_image: "nvidia/cuda:13.1.1-cudnn-devel-ubuntu24.04"
            wheel_tag: "cu130"
            archs: "89;90a;120a"

    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER: gcc-13
      CMAKE_CXX_COMPILER: g++-13
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
      # Twelve jobs at one nvcc thread each peaks near 40 GB, inside the container's 60 GB
      # limit with room for the libsinfer.so link. nvcc's default of 8 threads compiles the
      # architectures of a translation unit at once and triples the per-job footprint
      # (csrc/CMakeLists.txt reads NVCC_THREADS into SUROGATE_NVCC_THREADS).
      CMAKE_BUILD_PARALLEL_LEVEL: 12
      NVCC_THREADS: 1
      CUDAARCHS: ${{ matrix.archs }}
      # A wheel without an engine in it is not this package: a missing FFmpeg, libcurl or
      # toolkit must fail the build rather than quietly produce a trainer-only wheel.
      SKBUILD_CMAKE_DEFINE: SUROGATE_REQUIRE_SERVE=ON
      UV_NO_SYNC: 1
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 10G
      CCACHE_CUDA_PATHS: /usr/local/cuda

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends --allow-change-held-packages \
          git wget build-essential cmake ninja-build python3-dev ccache libopenmpi-dev libdw-dev libelf-dev libicu-dev patch libnccl2 libnccl-dev \
          g++-13 \
          pkg-config libcurl4-openssl-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libnuma-dev

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup ccache
        run: |
          mkdir -p /ccache
          ccache --max-size=10G
          ccache --zero-stats

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust for structured output
        run: |
          wget -qO /tmp/surogate-rustup.sh https://sh.rustup.rs
          sh /tmp/surogate-rustup.sh -y --profile minimal --default-toolchain 1.90.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add CUDA version tag
        run: uv run --no-project --with tomlkit python3 .github/scripts/set_cuda_version_tag.py "${{ matrix.wheel_tag }}"

      - name: Build wheel
        run: uv build --wheel --out-dir wheelhouse

      - name: Show ccache stats
        run: ccache --show-stats

      # auditwheel vendors every shared library the wheel's ELF files load and the manylinux
      # policy does not promise, and patches their RPATHs to find the copies. What is excluded
      # arrives another way and must stay excluded: the CUDA driver and the CUDA runtime libraries
      # come from the driver and the nvidia-* wheels the RPATHs already point at; libtorch is
      # surogate-stt's, from the torch wheel the package pins, reached through its own RPATH.
      # Vendoring a second libtorch would double the wheel and fail here anyway, since the build's
      # isolated environment is gone by the time this step runs.
      - name: Repair wheel
        run: |
          uv run --no-project --with auditwheel --with patchelf auditwheel repair wheelhouse/*.whl \
            -w repaired/ \
            --exclude libcuda.so.1 \
            --exclude libcudart.so.12 \
            --exclude libcudart.so.13 \
            --exclude libcudnn.so.9 \
            --exclude libcufile.so.0 \
            --exclude libnccl.so.2 \
            --exclude libcublas.so.12 \
            --exclude libcublas.so.13 \
            --exclude libcublasLt.so.12 \
            --exclude libcublasLt.so.13 \
            --exclude libnvidia-ml.so.1 \
            --exclude libcupti.so.13 \
            --exclude libnvrtc.so.13 \
            --exclude libtorch_cpu.so \
            --exclude libtorch.so \
            --exclude libc10.so
          mv repaired/*.whl wheelhouse/
          rm -f wheelhouse/*linux_x86_64*.whl
          ls -lh wheelhouse/

      # An install-rule or component mistake produces a wheel that builds, installs, imports --
      # and has no engine in it. The only way to know is to look inside the artifact.
      - name: The wheel carries the engine, for both architectures
        run: |
          set -euo pipefail
          rm -rf /tmp/wheel-check && mkdir -p /tmp/wheel-check
          python3 -m zipfile -e wheelhouse/*.whl /tmp/wheel-check
          for f in surogate/serve/_bin/surogate-engine \
                   surogate/serve/_bin/surogate-engine-cli \
                   surogate/serve/_bin/surogate-embed \
                   surogate/serve/_bin/surogate-stt \
                   surogate/serve/_bin/surogate-stt-lm \
                   surogate/serve/_bin/surogate-tts \
                   surogate/serve/_bin/surogate-tts-worker \
                   surogate/libsinfer.so \
                   surogate/serve/_llama_cpp/bin/llama-quantize; do
            if [ ! -f "/tmp/wheel-check/$f" ]; then
              echo "::error::the wheel is missing $f"
              exit 1
            fi
          done
          cuobjdump -lelf /tmp/wheel-check/surogate/libsinfer.so \
            | grep -oE 'sm_[0-9]+a?' | sort | uniq -c | tee /tmp/wheel-cubins.txt
          for arch in sm_89 sm_120a; do
            if ! grep -q "$arch" /tmp/wheel-cubins.txt; then
              echo "::error::the wheel's engine has no $arch cubins — it does not serve the whole RTX line"
              exit 1
            fi
          done
          rm -rf /tmp/wheel-check

      # Both wheels train, and the trainer's device code lives in libsurogate-common.so (the
      # extension module is a thin binding). CUDAARCHS above is the promise; this is the check.
      - name: The wheel trains on Ada, Hopper and Blackwell
        run: |
          set -euo pipefail
          rm -rf /tmp/wheel-check && mkdir -p /tmp/wheel-check
          python3 -m zipfile -e wheelhouse/*.whl /tmp/wheel-check
          cuobjdump -lelf /tmp/wheel-check/surogate/libsurogate-common.so \
            | grep -oE 'sm_[0-9]+a?' | sort | uniq -c | tee /tmp/trainer-cubins.txt
          for arch in sm_89 sm_90a sm_120a; do
            if ! grep -q "$arch" /tmp/trainer-cubins.txt; then
              echo "::error::the trainer has no $arch cubins"
              exit 1
            fi
          done
          rm -rf /tmp/wheel-check

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_tag }}
          path: wheelhouse/*.whl

  release:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find previous tag
        id: prev
        shell: bash
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"

          # previous release tag before the current one. --match keeps the jackalope release
          # channel's tags (jackalope-latest, jackalope-vX.Y.Z) out of the changelog range.
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${current}^" 2>/dev/null || true)"

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from Conventional Commits
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            ${{ steps.prev.outputs.prev && format('{0}..HEAD', steps.prev.outputs.prev) || '' }}
            --strip header
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheelhouse/
          merge-multiple: true

      - name: Pin version in install.sh
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s|^VERSION_OVERRIDE=\"\"|VERSION_OVERRIDE=\"${version}\"|" install.sh
          grep '^VERSION_OVERRIDE=' install.sh

      - name: Create release with changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            wheelhouse/*.whl
            install.sh
          draft: false
          fail_on_unmatched_files: true
