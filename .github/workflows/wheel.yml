name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  # A manual run builds and checks the wheel and uploads it as an artifact; only a tag
  # publishes a release. That is how a change to this file is proven before a tag needs it.
  workflow_dispatch:

jobs:
  wheel:
    name: Build wheel (CUDA ${{ matrix.cuda_version }})
    # GitHub-hosted. The self-hosted build box is gone, and nothing about this build needs one:
    # there is no GPU in it (CUDAARCHS names the architectures, and the checks read the cubins
    # with cuobjdump) and the toolkit is installed below. The standard runner for a public
    # repository is 4 vCPUs, 16 GB and about 100 GB of free disk, at no cost. A cold build is
    # about 8 CPU-hours -- the near-cold build of 2026-09-21 (79% ccache misses) took 57 minutes
    # at 8 jobs on the old box -- so it fits the six-hour limit here, and ccache, kept in the
    # Actions cache, makes the next one much shorter.
    #
    # `SUROGATE_WHEEL_RUNNER`, a repository variable, points the job at another label -- a larger
    # GitHub-hosted runner, say -- without editing this file. The job sizes its parallelism to
    # the runner it lands on, so nothing else changes.
    runs-on: ${{ vars.SUROGATE_WHEEL_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360

    strategy:
      matrix:
        include:
          # One wheel. The engine needs CUDA 13.0 or newer -- 12.8 and 12.9 cap a block's static
          # shared memory at 48 KB and refuse the W8 and NVFP4 GEMM families for sm_120a -- and a
          # package that serves is the product, so there is no CUDA 12 wheel to build. 13.1 is
          # the newest of that line; a binary built with it runs on a 13.0 driver.
          #
          # `archs` is the *trainer's* architecture set (CUDAARCHS), and it is the only place one
          # exists: csrc/CMakeLists.txt declares a floor (SUROGATE_MIN_CUDA_ARCH 89) and, left
          # alone, probes nvidia-smi and builds for the one card it finds. So this list is what
          # the published wheel can train on, and nothing else has an opinion.
          #
          # Three architectures, each with a claim on it. sm_89 is Ada -- the 4090, L4, L40.
          # sm_90a is Hopper, which the README's headline benchmark is measured on (53,900
          # tok/s on one H100). sm_120a is the RTX 50 series and the RTX PRO 6000. Datacenter
          # Blackwell -- sm_100a (B200) and sm_103a (B300) -- is not here: no code path, no
          # benchmark and no config asks for it.
          #
          # The serve engine keeps its own list, `SUROGATE_SERVE_CUDA_ARCHS`, narrower still at
          # sm_89 and sm_120a -- one binary for the 4090, the 5090 and the RTX PRO 6000. It is
          # left at its default here and checked in the wheel afterwards; restating it in the
          # workflow would only be a second place to be wrong.
          #
          # The toolkit comes from NVIDIA's apt repository for Ubuntu 24.04 -- the same packages
          # the nvidia/cuda:13.1.1-cudnn-devel-ubuntu24.04 image the self-hosted job ran in is
          # made of -- rather than from that image as a job container, which would start before
          # any step could add the swap the build needs on a 16 GB runner.
          - cuda_version: "13.1"
            wheel_tag: "cu130"
            archs: "89;90a;120a"

    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER: gcc-13
      CMAKE_CXX_COMPILER: g++-13
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
      # One architecture at a time per job: nvcc's default of 8 threads does all three at once
      # and triples the per-job footprint (csrc/CMakeLists.txt reads NVCC_THREADS into
      # SUROGATE_NVCC_THREADS). How many jobs is decided from the runner's memory, below.
      NVCC_THREADS: 1
      CUDAARCHS: ${{ matrix.archs }}
      CUDA_HOME: /usr/local/cuda-${{ matrix.cuda_version }}
      CUDACXX: /usr/local/cuda-${{ matrix.cuda_version }}/bin/nvcc
      # A wheel without an engine in it is not this package: a missing FFmpeg, libcurl or
      # toolkit must fail the build rather than quietly produce a trainer-only wheel.
      SKBUILD_CMAKE_DEFINE: SUROGATE_REQUIRE_SERVE=ON
      UV_NO_SYNC: 1
      # One cold build leaves about 2 GB of objects; 5 GB holds it and the generation before.
      CCACHE_MAXSIZE: 5G
      CCACHE_CUDA_PATHS: /usr/local/cuda-${{ matrix.cuda_version }}

    defaults:
      run:
        working-directory: ${{ github.workspace }}
        # `bash` rather than the default `bash -e`: the checks below rely on pipefail.
        shell: bash

    steps:
      # The runner image ships toolchains this build never uses, on the disk it needs; the CUDA
      # toolkit alone is about 15 GB installed.
      #
      # Memory decides the parallelism. The CUTLASS FP4 translation units take roughly 8 GB of
      # cicc per job (measured on the self-hosted box: 12 jobs crossed a 60 GB cap, 8 jobs peak
      # near 64 GB), so the build runs as many jobs as memory plus swap holds at 8 GB each, and no
      # more than there are CPUs: 4 on the standard runner, whose 16 GB get a 24 GB swap file as
      # the margin for the odd moment two FP4 units and the libsinfer.so link coincide.
      - name: Make room on the runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/julia* /opt/microsoft /usr/lib/jvm /usr/local/lib/node_modules /opt/az \
            /usr/local/share/chromium /usr/local/share/vcpkg 2>/dev/null || true
          swapdir=/mnt; [ -d /mnt ] || swapdir=/
          free_gb=$(df --output=avail -BG "$swapdir" | tail -1 | tr -dc 0-9)
          swap=$(( free_gb / 4 )); [ "$swap" -gt 24 ] && swap=24
          if [ "$swap" -ge 4 ]; then
            sudo fallocate -l "${swap}G" "$swapdir/swapfile-build" && sudo chmod 600 "$swapdir/swapfile-build" \
              && sudo mkswap "$swapdir/swapfile-build" >/dev/null && sudo swapon "$swapdir/swapfile-build"
          fi
          mem_gb=$(free -g | awk '/^Mem:/ {print $2}')
          swap_gb=$(free -g | awk '/^Swap:/ {print $2}')
          jobs=$(( (mem_gb + swap_gb) / 8 )); cpus=$(nproc)
          [ "$jobs" -gt "$cpus" ] && jobs=$cpus
          [ "$jobs" -lt 1 ] && jobs=1
          {
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs"
            echo "CCACHE_DIR=$HOME/.ccache"
          } >> "$GITHUB_ENV"
          echo "${cpus} CPUs, ${mem_gb} GB memory, ${swap_gb} GB swap: ${jobs} build jobs"
          df -h / "$swapdir" | uniq

      - name: Install CUDA ${{ matrix.cuda_version }} and build dependencies
        run: |
          set -euo pipefail
          wget -qO /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update -qq
          v="${{ matrix.cuda_version }}"; pkg="${v/./-}"; major="${v%%.*}"
          # NCCL is published per CUDA version (2.29.3-1+cuda13.1, ...); take the newest build for
          # this toolkit, else the newest for its major (the runtime soname is the same across a
          # major, and the wheel's runtime NCCL comes from nvidia-nccl-cu13 anyway).
          versions=$(apt-cache madison libnccl2 | awk '{print $3}')
          nccl=$(echo "$versions" | grep -F "+cuda${v}" | sort -V | tail -1 || true)
          [ -n "$nccl" ] || nccl=$(echo "$versions" | grep -F "+cuda${major}." | sort -V | tail -1 || true)
          [ -n "$nccl" ] || { echo "::error::no libnccl2 build for CUDA ${v} in the repository"; exit 1; }
          echo "nccl: $nccl"
          sudo apt-get install -y -qq --no-install-recommends \
            "cuda-toolkit-${pkg}" "cudnn9-cuda-${major}" "libnccl2=${nccl}" "libnccl-dev=${nccl}" \
            g++-13 python3-dev ninja-build ccache libopenmpi-dev libdw-dev libelf-dev libicu-dev patch \
            pkg-config libcurl4-openssl-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libnuma-dev
          echo "/usr/local/cuda-${v}/bin" >> "$GITHUB_PATH"
          "/usr/local/cuda-${v}/bin/nvcc" --version | tail -2
          df -h / | tail -1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      # Restore and save are separate steps so a build that runs out of time still seeds the
      # cache: re-running the job then picks up where it stopped. Every attempt saves under its
      # own key, since a cache entry cannot be overwritten, and a restore takes the newest entry
      # for this commit, else the newest at all. A run sees what was saved on its own ref or on
      # the default branch -- so a tag's build is warm when the same commit was built on main
      # first (Actions -> Build Wheels -> Run workflow), and cold otherwise.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.wheel_tag }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.wheel_tag }}-${{ github.sha }}-
            ccache-${{ matrix.wheel_tag }}-

      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust for structured output
        run: |
          if command -v rustup >/dev/null; then
            rustup toolchain install 1.90.0 --profile minimal
            rustup default 1.90.0
          else
            wget -qO /tmp/surogate-rustup.sh https://sh.rustup.rs
            sh /tmp/surogate-rustup.sh -y --profile minimal --default-toolchain 1.90.0
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add CUDA version tag
        run: uv run --no-project --with tomlkit python3 .github/scripts/set_cuda_version_tag.py "${{ matrix.wheel_tag }}"

      # The step's own limit leaves the job time to save the cache when a build runs long.
      - name: Build wheel
        timeout-minutes: 320
        run: uv build --wheel --out-dir wheelhouse

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.wheel_tag }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # auditwheel vendors every shared library the wheel's ELF files load and the manylinux
      # policy does not promise, and patches their RPATHs to find the copies. What is excluded
      # arrives another way and must stay excluded: the CUDA driver and the CUDA runtime libraries
      # come from the driver and the nvidia-* wheels the RPATHs already point at; libtorch is
      # surogate-stt's, from the torch wheel the package pins, reached through its own RPATH.
      # Vendoring a second libtorch would double the wheel and fail here anyway, since the build's
      # isolated environment is gone by the time this step runs.
      - name: Repair wheel
        run: |
          uv run --no-project --with auditwheel --with patchelf auditwheel repair wheelhouse/*.whl \
            -w repaired/ \
            --exclude libcuda.so.1 \
            --exclude libcudart.so.12 \
            --exclude libcudart.so.13 \
            --exclude libcudnn.so.9 \
            --exclude libcufile.so.0 \
            --exclude libnccl.so.2 \
            --exclude libcublas.so.12 \
            --exclude libcublas.so.13 \
            --exclude libcublasLt.so.12 \
            --exclude libcublasLt.so.13 \
            --exclude libnvidia-ml.so.1 \
            --exclude libcupti.so.13 \
            --exclude libnvrtc.so.13 \
            --exclude libtorch_cpu.so \
            --exclude libtorch.so \
            --exclude libc10.so
          mv repaired/*.whl wheelhouse/
          rm -f wheelhouse/*linux_x86_64*.whl
          ls -lh wheelhouse/

      # An install-rule or component mistake produces a wheel that builds, installs, imports --
      # and has no engine in it. The only way to know is to look inside the artifact.
      - name: The wheel carries the engine, for both architectures
        run: |
          set -euo pipefail
          rm -rf /tmp/wheel-check && mkdir -p /tmp/wheel-check
          python3 -m zipfile -e wheelhouse/*.whl /tmp/wheel-check
          for f in surogate/serve/_bin/surogate-engine \
                   surogate/serve/_bin/surogate-engine-cli \
                   surogate/serve/_bin/surogate-embed \
                   surogate/serve/_bin/surogate-stt \
                   surogate/serve/_bin/surogate-stt-lm \
                   surogate/serve/_bin/surogate-tts \
                   surogate/serve/_bin/surogate-tts-worker \
                   surogate/libsinfer.so \
                   surogate/serve/_llama_cpp/bin/llama-quantize; do
            if [ ! -f "/tmp/wheel-check/$f" ]; then
              echo "::error::the wheel is missing $f"
              exit 1
            fi
          done
          cuobjdump -lelf /tmp/wheel-check/surogate/libsinfer.so \
            | grep -oE 'sm_[0-9]+a?' | sort | uniq -c | tee /tmp/wheel-cubins.txt
          for arch in sm_89 sm_120a; do
            if ! grep -q "$arch" /tmp/wheel-cubins.txt; then
              echo "::error::the wheel's engine has no $arch cubins — it does not serve the whole RTX line"
              exit 1
            fi
          done
          rm -rf /tmp/wheel-check

      # Both wheels train, and the trainer's device code lives in libsurogate-common.so (the
      # extension module is a thin binding). CUDAARCHS above is the promise; this is the check.
      - name: The wheel trains on Ada, Hopper and Blackwell
        run: |
          set -euo pipefail
          rm -rf /tmp/wheel-check && mkdir -p /tmp/wheel-check
          python3 -m zipfile -e wheelhouse/*.whl /tmp/wheel-check
          cuobjdump -lelf /tmp/wheel-check/surogate/libsurogate-common.so \
            | grep -oE 'sm_[0-9]+a?' | sort | uniq -c | tee /tmp/trainer-cubins.txt
          for arch in sm_89 sm_90a sm_120a; do
            if ! grep -q "$arch" /tmp/trainer-cubins.txt; then
              echo "::error::the trainer has no $arch cubins"
              exit 1
            fi
          done
          rm -rf /tmp/wheel-check

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_tag }}
          path: wheelhouse/*.whl

  release:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find previous tag
        id: prev
        shell: bash
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"

          # previous release tag before the current one. --match keeps the jackalope release
          # channel's tags (jackalope-latest, jackalope-vX.Y.Z) out of the changelog range.
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${current}^" 2>/dev/null || true)"

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from Conventional Commits
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            ${{ steps.prev.outputs.prev && format('{0}..HEAD', steps.prev.outputs.prev) || '' }}
            --strip header
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheelhouse/
          merge-multiple: true

      - name: Pin version in install.sh
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s|^VERSION_OVERRIDE=\"\"|VERSION_OVERRIDE=\"${version}\"|" install.sh
          grep '^VERSION_OVERRIDE=' install.sh

      - name: Create release with changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            wheelhouse/*.whl
            install.sh
          draft: false
          fail_on_unmatched_files: true
