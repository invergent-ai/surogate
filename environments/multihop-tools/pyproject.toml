[project]
name = "multihop-tools"
description = "Synthetic multi-hop lookup environment for turn-level GRPO/OPD diagnostics"
tags = ["multi-turn", "tool-use", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["multihop_tools.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
