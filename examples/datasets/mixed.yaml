# Small local format demonstration; replace these rows for a real training run.
model: Qwen/Qwen3-0.6B
output_dir: ./outputs/datasets/mixed
resume_from_checkpoint: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
sample_packing: false
sequence_len: 256
max_steps: 10
eval_steps: 5
learning_rate: 2e-4
recipe: bf16
train_vision: false
warmup_ratio: 0.15
lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
dataloader_num_workers: 4
datasets:
- path: ./examples/datasets/instructions.jsonl
  type: instruction
  instruction_field: task
  input_field: context
  output_field: answer
  system_prompt_type: fixed
  system_prompt: Answer with one word.
- path: ./examples/datasets/conversations.jsonl
  type: conversation
  messages_field: dialog
save_steps: 0
validation_datasets:
- path: ./examples/datasets/validation.jsonl
  type: conversation
  messages_field: dialog
