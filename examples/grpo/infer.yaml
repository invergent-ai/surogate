# Rollout server for the GRPO example.
#
# `backend` selects the engine. It defaults to "surogate" -- this repository's own
# serving engine -- and "vllm" remains available for comparison. The engine reads a
# HuggingFace directory or a GGUF and builds its artifact on first use, cached.
model: "Qwen/Qwen3-0.6B"
enable_lora: true
max_lora_rank: 32
max_loras: 4
max_model_len: 2048
max_num_seqs: 32
port: 8007
