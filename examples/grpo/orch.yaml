# GRPO Orchestrator Example

model:
  name: "Qwen/Qwen3-0.6B"
  lora_adapter: "default"
  lora_rank: 16
  lora_alpha: 32

env:
  - id: markdown-table-qa

batch_size: 8
rollouts_per_example: 8
seq_len: 2048
max_steps: 6
# Token-in rollouts: the next turn's prompt extends the ids the last one produced
# instead of being re-rendered, which keeps a multi-turn trajectory one training
# sample. Needs /tokenize and /v1/chat/completions/tokens, which the engine serves.
use_token_client: true

sampling:
  max_tokens: 1024
  # A thinking model needs room to finish before it can answer: too small a budget
  # truncates every rollout, every reward is zero, and with no advantage to learn
  # from the trainer never takes a step.
  min_tokens: 24
  temperature: 1.0
  top_p: 1.0
  repetition_penalty: 1.05
  seed: 1234
  extra_body:
    top_k: -1        # -1 means "do not truncate"
    min_p: 0.02
    chat_template_kwargs:
      enable_thinking: true

client:
  base_url:
    - http://localhost:8007/v1

dump_metrics: true

# Must be the trainer's `output_dir` plus its run name. The orchestrator writes the
# training batches here and the trainer reads them from the same place; when the two
# disagree neither errors -- the orchestrator simply waits for a policy update that
# never comes, and the run hangs with both GPUs idle.
output_dir: ./outputs/run_default
