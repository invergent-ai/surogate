# grpo: orch configuration. See README.md in this directory.
model:
  name: Qwen/Qwen3-0.6B
  lora_adapter: default
env:
- id: markdown-table-qa
  path: ./environments/markdown-table-qa
batch_size: 8
rollouts_per_example: 8
max_steps: 20
use_token_client: true
sampling:
  max_tokens: 1024
  min_tokens: 24
  top_p: 1.0
  repetition_penalty: 1.05
  seed: 1234
  extra_body:
    top_k: -1
    min_p: 0.02
    chat_template_kwargs:
      enable_thinking: true
  temp_scheduler:
    type: linear
    start_temperature: 1.0
    end_temperature: 0.7
    total_steps: 20
client:
  base_url:
  - http://localhost:8007/v1
dump_metrics: true
output_dir: ./outputs/grpo/run_default
sequence_len: 2048
eval:
  env:
  - id: markdown-table-qa
    path: ./environments/markdown-table-qa
  num_examples: 16
  rollouts_per_example: 4
  interval: 10
  eval_base_model: true
buffer:
  online_difficulty_filtering: true
  easy_threshold: 1.0
  hard_threshold: 0.0
  easy_fraction: 0.1
  hard_fraction: 0.1
ckpt:
  interval: 10
  keep_last: 2
