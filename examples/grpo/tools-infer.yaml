# grpo: infer configuration for the tool environment. See README.md.
#
# Identical to infer.yaml but for the tool gate. It is a separate file because
# `enable_auto_tool_choice` opens tool-call parsing for every completion, and
# the field's own documentation says only the environments that need it should
# ask -- the markdown-table-qa example that shares infer.yaml never calls a
# tool.
model: Qwen/Qwen3-0.6B
enable_lora: true
max_lora_rank: 32
max_loras: 4
max_model_len: 2048
max_num_seqs: 8
port: 8007
# Required by any tool-using environment: the ToolEnv loop reads structured
# `tool_calls` back off the assistant message, and the engine only fills that
# field for a `tool_choice: auto` request when this gate is open. Without it
# every tool rollout scores zero and the run trains on nothing, silently.
enable_auto_tool_choice: true
