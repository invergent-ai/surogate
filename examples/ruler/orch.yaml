# ruler: orch configuration. See README.md in this directory.
output_dir: ./outputs/ruler/run_default
model:
  name: Qwen/Qwen3-0.6B
  lora_adapter: default
env:
- id: markdown-table-qa
  path: ./environments/markdown-table-qa
client:
  base_url:
  - http://localhost:8007/v1
batch_size: 16
rollouts_per_example: 4
max_steps: 20
use_token_client: false
sampling:
  max_tokens: 256
verification:
  enabled: true
ruler:
  enabled: true
  mode: replace
  judge_model: Qwen/Qwen3-1.7B
  judge:
    base_url:
    - http://localhost:8001/v1
    api_key_var: RULER_JUDGE_API_KEY
    timeout: 90.0
  weight: 1.0
  max_concurrent_judges: 8
  sampling:
    temperature: 0.0
    max_completion_tokens: 4096
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  swallow_exceptions: false
eval:
  env:
  - id: markdown-table-qa
    path: ./environments/markdown-table-qa
  num_examples: 16
  rollouts_per_example: 4
  interval: 10
  eval_base_model: true
dump_metrics: true
sequence_len: 2048
