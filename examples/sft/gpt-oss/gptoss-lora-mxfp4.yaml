model: openai/gpt-oss-20b
output_dir: ./outputs/sft/gpt-oss/gptoss-lora-mxfp4
resume_from_checkpoint: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 4

sample_packing: true
sequence_len: 512
gpus: 4
ep_size: 4
ep_load_balance_threshold: 1.0

max_steps: 100
eval_steps: 25

learning_rate: 2e-4
warmup_ratio: 0.1

recipe: fp8-hybrid
train_vision: false
lmhead_chunks: 8

lora: true
lora_rank: 16
lora_alpha: 32
lora_dtype: bf16

lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_up_proj
  - down_proj

dataloader_num_workers: 4
datasets:
  - path: "OpenLLM-Ro/ro_gsm8k"
    type: auto
