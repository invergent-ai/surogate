# Laguna-S: eight GPUs with CPU weight offload, expert parallelism and
# eight sequence chunks. Requires substantial host RAM for the 117B base.
model: poolside/Laguna-S-2.1
output_dir: ./outputs/sft/laguna/laguna-s-lora-fp8
resume_from_checkpoint: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
gpus: 8
cpu_training: true
ep_size: 8
ep_load_balance_threshold: 1.3
offload_residual: true

sample_packing: true
sequence_len: 2048
sequence_chunks: 8

max_steps: 100
eval_steps: 25
learning_rate: 2e-4

recipe: fp8-hybrid
train_vision: false
lmhead_chunks: 8

lora: true
lora_rank: 16
lora_alpha: 32
lora_dtype: bf16

lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

dataloader_num_workers: 4
datasets:
  - path: "OpenLLM-Ro/ro_gsm8k"
    type: auto
