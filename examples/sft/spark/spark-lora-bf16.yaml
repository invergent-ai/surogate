model: XHToken/Spark-X2.5-1.7B
output_dir: ./outputs/sft/spark/spark-lora-bf16
resume_from_checkpoint: false

recipe: bf16
train_vision: false
lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0
lora_target_modules: [q_k_v_proj, out_proj, gate_proj, up_proj, down_proj]

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
sequence_len: 1024
sample_packing: true
recompute: true
max_steps: 100
learning_rate: 2e-4
warmup_ratio: 0.05

datasets:
  - path: OpenLLM-Ro/ro_gsm8k
    type: auto
