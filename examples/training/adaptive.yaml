# Adaptive actions and local metrics; add wandb/aim as described in README.
model: Qwen/Qwen3-0.6B
output_dir: ./outputs/training/adaptive
resume_from_checkpoint: false
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
sample_packing: true
sequence_len: 2048
max_steps: -1
eval_steps: 25
learning_rate: 2e-4
recipe: bf16
train_vision: false
warmup_ratio: 0.15
lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
dataloader_num_workers: 4
datasets:
- path: OpenLLM-Ro/ro_gsm8k
  type: auto
num_epochs: 3
auto_lr_reduction: true
early_stop: true
epoch_adjustment: true
lr_scheduler_type: wsd
wsd_decay_steps_fraction: 0.2
final_lr_fraction: 0.1
save_steps: 25
save_total_limit: 2
report_to:
- surogate
surogate_metrics_path: ./outputs/training/adaptive/metrics.jsonl
