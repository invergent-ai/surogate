# CPU weight/gradient/optimizer offload; forward/backward still require a GPU.
model: Qwen/Qwen3-0.6B
output_dir: ./outputs/training/cpu-offload
resume_from_checkpoint: false
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
sample_packing: true
sequence_len: 2048
max_steps: 100
eval_steps: 25
learning_rate: 2.0e-05
recipe: bf16
train_vision: false
warmup_ratio: 0.15
lora: false
dataloader_num_workers: 4
datasets:
- path: OpenLLM-Ro/ro_gsm8k
  type: auto
cpu_training: true
offload_residual: true
offload_saved_tensors: true
optimizer: adamw_8bit
