# Full-parameter SFT: surogate sft examples/training/full-finetune.yaml
model: Qwen/Qwen3-0.6B
output_dir: ./outputs/training/full-finetune
resume_from_checkpoint: false
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
sample_packing: true
sequence_len: 2048
max_steps: 100
eval_steps: 25
learning_rate: 2.0e-05
recipe: bf16
train_vision: false
warmup_ratio: 0.15
lora: false
dataloader_num_workers: 4
datasets:
- path: OpenLLM-Ro/ro_gsm8k
  type: auto
optimizer: adamw
master_dtype: fp32
gradient_dtype: fp32
lr_scheduler_type: cosine
weight_decay: 0.01
auto_lmhead_chunks: true
