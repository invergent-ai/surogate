# Four GPUs, ZeRO-3 and persistent FP8 weight offload; launch one process.
model: Qwen/Qwen3-0.6B
output_dir: ./outputs/training/multi-gpu
resume_from_checkpoint: false
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
sample_packing: true
sequence_len: 2048
max_steps: 100
eval_steps: 25
learning_rate: 2.0e-05
recipe: fp8-hybrid
train_vision: false
warmup_ratio: 0.15
lora: false
dataloader_num_workers: 4
datasets:
- path: OpenLLM-Ro/ro_gsm8k
  type: auto
gpus: 4
zero_level: 3
optimizer: adamw_8bit
shard_weights: true
persistent_quants: true
offload_quants: true
offload_optimizer: true
use_zero_copy: true
offload_grads: true
memcpy_all_gather: true
memcpy_send_recv: true
