# turnopd: orch configuration. See README.md in this directory.
model:
  name: Qwen/Qwen3.5-2B
  lora_adapter: default
teacher_model:
  model:
    name: Qwen/Qwen3.5-9B
  client:
    base_url:
    - http://localhost:8008/v1
env:
- id: multihop-tools
  path: ./environments/multihop-tools
  args:
    num_examples: 2000
    n_chains: 120
    min_hops: 2
    max_hops: 4
    max_turns: 12
batch_size: 32
rollouts_per_example: 8
max_steps: 30
use_token_client: false
sampling:
  max_tokens: 256
  temperature: 1.0
client:
  base_url:
  - http://localhost:8007/v1
rollout_depth:
  enabled: true
  quantile: 0.8
  probe_interval: 6
  warmup_steps: 2
dump_metrics: true
output_dir: ./outputs/turnopd/run_default
sequence_len: 2048
