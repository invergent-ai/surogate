# turnopd: train configuration. See README.md in this directory.
model: Qwen/Qwen3.5-2B
output_dir: ./outputs/turnopd
per_device_train_batch_size: 1
sequence_len: 2048
max_steps: 30
logging_steps: 1
learning_rate: 1e-4
lr_scheduler_type: constant
warmup_steps: 0
max_grad_norm: 1.0
weight_decay: 0.01
optimizer: adamw
recipe: bf16
lora: true
lora_rank: 16
lora_alpha: 32
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
loss:
  adv_tau: 1.0
  teacher_tau: 1.0
  kl_tau: 0.001
turn_diagnostics: true
save_steps: 10
report_to:
- surogate
resume_from_checkpoint: false
train_vision: false
gpus: 1
surogate_metrics_path: ./outputs/turnopd/metrics.jsonl
