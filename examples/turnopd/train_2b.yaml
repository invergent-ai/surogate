# TurnOPD diagnostic, run B: 2B student trainer.
# Student/teacher = Qwen3.5-2B / Qwen3.5-9B, the paper's Multi-Hop Search pairing.
model: "Qwen/Qwen3.5-2B"
output_dir: ./outputs/turnopd_2b

per_device_train_batch_size: 1
sequence_len: 2048

max_steps: 30
logging_steps: 1

learning_rate: 1e-4
lr_scheduler_type: constant
warmup_steps: 0
max_grad_norm: 1.0
weight_decay: 0.01
optimizer: adamw

recipe: bf16

# gradient_dtype is left at the GRPO fp32 default; master_dtype follows the model
# dtype (bf16), which measured runs show is enough — the fp32 master this config
# used to assume was what made a 4B student overflow a single 32GB card (29.3GB
# arena). Precision on the trainable side comes from lora_dtype (fp32 by default).
# 2B is also the paper's own Multi-Hop Search student.

lora: true
lora_rank: 16
lora_alpha: 32
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

loss:
  adv_tau: 1.0
  teacher_tau: 1.0
  kl_tau: 1.0e-3

turn_diagnostics: true

save_steps: 0

report_to:
  - surogate
