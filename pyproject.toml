[project]
name = "surogate"
dynamic = ["version"]
description = "Surogate LLMOps Toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "surogate/kernels/triton/fla_kda/LICENSE", "csrc/src/serve/family/impl/sglang-LICENSE", "csrc/src/serve/encoder/cpu/ik_llama-LICENSE", "csrc/src/serve/speech/NOTICE"]
authors = [
    { name = "Flavius Burca", email = "flavius@invergent.ai" }
]
maintainers = [
    { name = "Flavius Burca", email = "flavius@invergent.ai" }
]
urls = { "Homepage" = "https://surogate.ai", "Repository" = "https://github.com/invergent-ai/surogate", "Issues" = "https://github.com/invergent-ai/surogate/issues" }
keywords = ["machine learning", "large language model"]
classifiers = [
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.11",
    "transformers>=5.5.0",
    "huggingface-hub>=1.4.1",
    "sentencepiece>=0.2.0",
    "hf-transfer>=0.1.9",
    "datasets>=4.3.0",
    "addict",
    "peft",
    "json_repair",
    "unique-namer",
    "nanobind",
    "binpacking",
    "rich>=13.0.0",
    "psutil",
    "matplotlib",
    "qwen-vl-utils==0.0.14",
    "ray>=2.5.0",
    "verifiers==0.3.0",
    "wandb==0.25.1",
    "jaxtyping",
    "aiolimiter",
    "openai==2.32.0",
    # GRPO's batch transport encodes with it (grpo/transport/base.py,
    # types.py). Undeclared since the transport landed in v1.0.0 and
    # unnoticed because vLLM pulled it in; when the rollout server stopped
    # being vLLM the dependency left with it and every GRPO run died at
    # ModuleNotFoundError before its first step.
    "msgspec",
    # Same bug as msgspec, found the same way. `grpo/transport/zmq.py` imports
    # zmq at module scope and `transport/__init__.py` imports that
    # unconditionally, so it is on the import path of every GRPO run whichever
    # transport is configured. `grpo/utils/client.py` imports tenacity the same
    # way. Both were vLLM dependencies too.
    "pyzmq",
    "tenacity",
    # The rest of the same class, found by walking module-scope imports from
    # the GRPO entry points and diffing against this list. Every one is
    # imported before step 1 of a run and every one survives today only
    # because something else drags it in: openai brings httpx and pydantic,
    # datasets brings numpy, pandas and PyYAML. That is exactly how msgspec
    # hid for a year, so they are named here rather than left to luck.
    #
    # Unpinned on purpose: they are already resolved transitively, and the
    # point is to make the dependency explicit, not to re-pin the tree.
    "pyyaml",      # grpo/orchestrator/grpo_orch.py, grpo/runs.py, core/config/loader.py
    "numpy",       # grpo/data.py, grpo/loss.py, grpo/trainer.py, orchestrator/eval_utils.py
    "pandas",      # grpo/orchestrator/{grpo_orch,eval_utils,utils}.py
    "httpx",       # grpo/utils/client.py, rewards/ruler.py
    "pydantic",    # rewards/ruler.py, grpo/utils/pydantic_config.py
    "safetensors"  # serve/convert/common/safetensors.py, via grpo/shared_weights.py
]
scripts = { "surogate" = "surogate.cli.main:cli_main" }

[project.optional-dependencies]
speech = ["silero-vad==6.2.1"]

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind", "torch>=2.11"]
build-backend = "scikit_build_core.build"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.1"

[tool.scikit-build]
minimum-version = "build-system.requires"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.py-api = "cp312"
wheel.packages = ["surogate"]
# The products of this build, all four of them EXCLUDE_FROM_ALL in csrc/CMakeLists.txt:
# naming them here is what makes `uv build --wheel` produce them rather than only the
# training extension module. `sinfer`/`sinfer-serve` are the CMake target names of
# surogate-engine-cli and surogate-engine; libsinfer.so comes with them, and holds the
# device code all three binaries and the serve module share.
build.targets = [
    "_surogate",
    "llama-quantize",
    "sinfer",
    "sinfer-serve",
    "surogate-embed",
    "surogate-stt",
    "surogate-tts",
    "_surogate_serve",
]
# Install this project's own components and nothing else. Two reasons, both load-bearing:
# ggml installs 23 public headers and a CMake package config whether or not anyone asked,
# which a Python wheel has no use for; and llama.cpp's `tools/` -- which upstream's own gate
# makes us enable to get `llama-quantize` at all -- carries install rules for targets this
# build never asked for, so a component-less install dies on a missing libmtmd.a.
install.components = ["surogate", "quantizer", "serve"]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
# `surogate quantize` ships with the wheel, so the quantiser is built and installed with it.
# Without this the command exists in the package and has nothing to run.
SUROGATE_BUILD_QUANTIZER = "ON"
PYTHON_BINDING = "ON"
# USE_CUFILE / REQUIRE_CUFILE are deliberately not set here: they default to ON in
# csrc/CMakeLists.txt. An explicit USE_CUFILE = "OFF" here is what silently shipped
# every released wheel without GPUDirect Storage.
CMAKE_CUDA_ARCHITECTURES = {env="CUDAARCHS"}
# The wheel serves as well as trains, so a build host without FFmpeg or libcurl must fail
# here rather than publish a package whose `surogate serve` exits 127. Note this governs
# only the host libraries: the serve engine's device code is built for
# SUROGATE_SERVE_CUDA_ARCHS -- the RTX line, Ada and Blackwell -- independently of CUDAARCHS
# above, so one published wheel serves a 4090, a 5090 and an RTX PRO 6000.
SUROGATE_REQUIRE_SERVE = "ON"

[tool.uv]
prerelease = "allow"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "surogate/**/*.py" },
    { file = "CMakeLists.txt" },
    { file = "csrc/CMakeLists.txt" }
]
override-dependencies = [
    "triton",
    "torch",
]

# ────────── Python formatter / linter ──────────
# Aligned with .clang-format for LLM/agent ergonomics: stable line boundaries,
# no aggressive re-flowing on edit, grep-friendly structure.
[tool.ruff]
line-length = 120                # matches .clang-format ColumnLimit
target-version = "py312"
extend-exclude = [
    "build",                     # scikit-build output
    ".venv",
    "csrc/build",
    "csrc/third_party",
    "surogate/kernels/triton/fla_kda",  # Vendored kernels retain upstream formatting.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false   # a trailing comma keeps items one-per-line,
                                    # which preserves grep targets and diff stability.
line-ending = "lf"

[tool.ruff.lint]
# Conservative default set. Style-heavy rules (like line-length W505) are OFF
# because the formatter handles whitespace; lint is for correctness bugs.
select = [
    "E",   # pycodestyle errors (indentation, whitespace correctness)
    "F",   # pyflakes (unused imports, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering) — deterministic insert slots for new imports
    "B",   # flake8-bugbear (likely bugs, e.g. mutable default args)
    "UP",  # pyupgrade (use modern syntax)
]
ignore = [
    "E501",  # line-too-long — formatter already handles it
    "E741",  # ambiguous single-letter names (e.g. `l`, `I`) — common in ML code
    "B008",  # function calls in argument defaults — common pattern with torch
    "B905",  # zip() without explicit strict= — not all call sites need strict
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]         # re-exports without use are intentional
"tests/**" = ["F401", "F811"]    # test fixtures often shadow/reimport
